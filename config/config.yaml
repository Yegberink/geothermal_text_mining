python: python
language: german
languages: auto
# Text language and geographic scope are separate. German-language text is
# processed against a multi-country DACH scope, while Dutch and Italian use
# one-country scopes. Legacy `country`/`countries` config is still accepted by
# scripts as a backward-compatible shorthand.
country_scope:
  countries_by_language:
    dutch:
      - Netherlands
    german:
      - Germany
      - Austria
      - Switzerland
    italian:
      - Italy
make_annotation_df: true

annotation:
  province_filter_regex: ""
  exclude_neutral: false
  sentence_sample_size: 500
  paragraph_sample_size: 100
  sample_random_state: 42

ollama:
  url: http://localhost:11434/api/generate
  location_model: llama3.1:8b
  geothermal_model: llama3.1:8b
  save_every: 25
  sleep_s: 0.0

sentiment_ollama:
  model: llama3.1:8b
  prompt_variant: zero_shot
  timeout: 120
  sleep_s: 0.0
  save_every: 25

online_geocoding:
  enable_nominatim: true
  provider: nominatim
  nominatim_policy_ack: true
  country_codes: ""
  country_codes_by_language:
    german: de,at,ch
  geonames_dir: data/geonames
  geonames_country_codes_by_language:
    dutch: nl
    italian: it
    german: de,at,ch
  user_agent: absa-geo-mapper
  lock_path: cache/geocode_unmatched_online.lock
  print_every: 25
  min_delay_seconds: 1.1
  timeout_seconds: 10
  max_retries: 3
  service_error_cooldown_seconds: 20
  retry_errors: true
  max_queries: 0

paths:
  input_rtf_dir: data/text_data
  shapes_parquet: data/shapes.parquet
  preprocess_rtf_chunks_dir: cache/preprocess_rtf_chunks
  keywords_topics_base_csv: data/vocab/keywords_topics.csv
  keywords_topics_csv: data/vocab/keywords_topics.csv

  articles_csv: output/workflow/articles_cleaned.csv
  paragraphs_csv: output/workflow/newspapers_cleaned_paragraphs.csv
  paragraph_keyword_filtered_csv: output/workflow/newspapers_keyword_filtered_paragraphs.csv
  paragraph_locations_csv: output/workflow/paragraph_locations_ollama.csv
  paragraph_geothermal_csv: output/workflow/paragraph_geothermal_ollama.csv
  paragraphs_with_geo_shapes_gpkg: output/workflow/paragraphs_with_geo_shapes.gpkg
  paragraph_shapes_geocoding_csv: output/workflow/paragraph_shapes_geocoding.csv
  paragraphs_with_geo_gpkg: output/workflow/paragraphs_with_geo.gpkg
  paragraphs_with_geo_csv: output/workflow/paragraphs_with_geo.csv
  geocode_unmatched_online_cache_jsonl: cache/geocode_unmatched_online.jsonl
  geocode_unmatched_online_done: cache/geocode_unmatched_online.done
  geocoding_cache_candidates_csv: output/workflow/geocoding_online_candidates.csv
  geocoding_cache_candidates_all_csv: output/generic/workflow/geocoding_online_candidates_all.csv
  geocoding_unmatched_csv: output/text/geocoding_unmatched.csv
  geocoding_suggestions_csv: output/text/geocoding_suggestions.csv
  sentence_locations_csv: output/workflow/sentence_locations_ollama.csv
  sentences_with_frames_long_csv: output/workflow/sentences_with_frames_long.csv
  sentences_with_frames_short_csv: output/workflow/sentences_with_frames_short.csv
  sentence_sentiment_csv: output/workflow/sentence_sentiment_llm.csv
  sentences_with_categories_gpkg: output/workflow/sentences_with_categories.gpkg
  sentences_with_categories_long_csv: output/workflow/sentences_with_categories_long.csv
  sentences_with_categories_short_csv: output/workflow/sentences_with_categories_short.csv
  sentences_with_categories_admin_gpkg: output/workflow/sentences_with_categories_admin.gpkg
  sentences_with_categories_admin_csv: output/workflow/sentences_with_categories_admin.csv
  figures_dir: output/figures
  text_results_dir: output/text
  articles_per_year_csv: output/text/articles_per_year.csv
  articles_per_year_png: output/figures/articles_per_year.png
  top_newspapers_csv: output/text/top_newspapers.csv
  top_newspapers_png: output/figures/top_newspapers.png
  article_descriptives_summary_csv: output/text/article_descriptives_summary.csv
  frame_keywords_dir: output/figures/frame_keywords
  region_frames_dir: output/figures/region_frames
  frame_keyword_figure_index_csv: output/text/frame_keyword_figure_index.csv
  province_frame_counts_csv: output/text/province_frame_counts.csv
  province_sentiment_summary_csv: output/text/province_sentiment_summary.csv
  province_sentiment_table_csv: output/text/province_sentiment_table.csv
  provinces_sentiment_balance_png: output/figures/provinces_sentiment_balance.png
  provinces_sentiment_distribution_png: output/figures/provinces_sentiment_distribution.png
  categories_sentiment_distribution_png: output/figures/categories_sentiment_distribution.png
  locations_map_html: output/figures/locations_map.html
  annotation_sentences_csv: annotation/sentences_for_annotation.csv
  data_tracking_csv: output/generic/text/data_tracking.csv

  geo_cache: cache/locations_ollama.jsonl
  geo_class_cache: cache/is_geothermal.jsonl
  sentence_sentiment_cache: cache/sentiment_classification.jsonl

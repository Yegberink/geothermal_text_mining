python: python
language: italian
country: Italy
make_annotation_df: true

annotation:
  province_filter_regex: Zuid-Holland|Limburg
  exclude_neutral: true

ollama:
  url: http://localhost:11434/api/generate
  location_model: llama3.1:8b
  geothermal_model: llama3.1:8b
  save_every: 25
  sleep_s: 0.0

sentiment_ollama:
  model: llama3.1:8b
  prompt_variant: zero_shot
  timeout: 120
  sleep_s: 0.0
  save_every: 25

online_geocoding:
  country_codes: ""
  user_agent: absa-geo-mapper
  save_every: 50
  print_every: 25
  min_delay_seconds: 1.1
  timeout_seconds: 10
  max_retries: 6
  backoff_base: 1.6
  jitter: 0.25
  max_queries: 0

paths:
  input_rtf_dir: input_data
  newspaper_regions_csv: data/newspaper_region_mapping.csv
  preprocess_rtf_chunks_dir: cache/preprocess_rtf_chunks
  municipality_gpkg: data/admin_areas_municipalities_2025.gpkg
  province_gpkg: data/admin_areas_provinces_2025.gpkg
  district_gpkg: data/statistical_areas_districts_2025.gpkg
  neighborhood_gpkg: data/statistical_areas_neighborhoods_2025.gpkg
  keywords_topics_base_csv: vocab/keywords_topics.csv
  keywords_topics_csv: cache/keywords_topics_effective.csv
  keyword_review_export_csv: annotation/frame_keyword_reviews.csv
  keyword_review_candidates_csv: annotation/frame_keyword_review_candidates.csv
  keyword_framework_audit_csv: output/text/keyword_framework_updates.csv

  articles_csv: output/text/articles_cleaned.csv
  paragraphs_csv: output/text/newspapers_cleaned_paragraphs.csv
  paragraph_keyword_filtered_csv: output/text/newspapers_keyword_filtered_paragraphs.csv
  paragraph_locations_csv: output/text/paragraph_locations_ollama.csv
  paragraph_geothermal_csv: output/text/paragraph_geothermal_ollama.csv
  paragraphs_with_geo_offline_gpkg: output/text/paragraphs_with_geo_offline.gpkg
  paragraph_offline_geocoding_csv: output/text/paragraph_offline_geocoding.csv
  paragraphs_with_geo_gpkg: output/text/paragraphs_with_geo.gpkg
  paragraphs_with_geo_csv: output/text/paragraphs_with_geo.csv
  sentence_locations_csv: output/text/sentence_locations_ollama.csv
  sentences_with_frames_long_csv: output/text/sentences_with_frames_long.csv
  sentences_with_frames_short_csv: output/text/sentences_with_frames_short.csv
  sentence_sentiment_csv: output/text/sentence_sentiment_llm.csv
  nominatim_cache_json: cache/nominatim_cache.json
  sentences_with_categories_gpkg: output/text/sentences_with_categories.gpkg
  sentences_with_categories_long_csv: output/text/sentences_with_categories_long.csv
  sentences_with_categories_short_csv: output/text/sentences_with_categories_short.csv
  sentences_with_categories_admin_gpkg: output/text/sentences_with_categories_admin.gpkg
  sentences_with_categories_admin_csv: output/text/sentences_with_categories_admin.csv
  figures_dir: output/figures
  articles_per_year_csv: output/figures/articles_per_year.csv
  articles_per_year_png: output/figures/articles_per_year.png
  top_newspapers_csv: output/figures/top_newspapers.csv
  top_newspapers_png: output/figures/top_newspapers.png
  article_descriptives_summary_csv: output/figures/article_descriptives_summary.csv
  frame_keywords_dir: output/figures/frame_keywords
  region_frames_dir: output/figures/region_frames
  province_sentiment_table_csv: output/figures/province_sentiment_table.csv
  provinces_sentiment_balance_png: output/figures/provinces_sentiment_balance.png
  provinces_sentiment_distribution_png: output/figures/provinces_sentiment_distribution.png
  categories_sentiment_distribution_png: output/figures/categories_sentiment_distribution.png
  locations_map_html: output/figures/locations_map.html
  annotation_sentences_csv: annotation/sentences_for_annotation.csv

  geo_checkpoint: cache/geo_checkpoint.parquet
  geo_cache: cache/geo_cache.jsonl
  geo_partial_csv: cache/geo_partial_results.csv
  geo_class_checkpoint: cache/geo_class_checkpoint.parquet
  geo_class_cache: cache/geo_class_cache.jsonl
  geo_class_partial_csv: cache/geo_class_partial_results.csv
  sentence_sentiment_checkpoint: cache/sentence_sentiment_ollama_checkpoint.parquet
  sentence_sentiment_cache: cache/sentence_sentiment_ollama_cache.jsonl
  sentence_sentiment_partial_csv: cache/sentence_sentiment_ollama_partial_results.csv
